name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: secret RELEASE_KEYSTORE_BASE64 is not set — сборка будет с CI-debug keystore, " \
                 "что несовместимо с ранее установленным APK. Добавь секреты RELEASE_KEYSTORE_BASE64," \
                 "RELEASE_KEYSTORE_STORE_PASS, RELEASE_KEYSTORE_KEY_ALIAS, RELEASE_KEYSTORE_KEY_PASS." >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > whereami-release.jks
          test -s whereami-release.jks

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH:       whereami-release.jks
          RELEASE_KEYSTORE_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_STORE_PASS }}
          RELEASE_KEYSTORE_KEY_ALIAS:  ${{ secrets.RELEASE_KEYSTORE_KEY_ALIAS }}
          RELEASE_KEYSTORE_KEY_PASS:   ${{ secrets.RELEASE_KEYSTORE_KEY_PASS }}
        run: ./gradlew :app:assembleRelease

      - name: Wipe keystore from runner (paranoia)
        if: always()
        run: rm -f whereami-release.jks

      - name: Extract versionCode
        id: v
        run: |
          code=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -n1)
          if [ -z "$code" ]; then
            echo "versionCode not found in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/WhereAmI-release.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "versionCode=${{ steps.v.outputs.code }}"

      - name: Delete old releases (keep only the latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].tagName' \
            | while read -r tag; do
                echo "delete $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
